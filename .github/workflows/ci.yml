name: BornoLand CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy Off-EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Express API (@bornoland/api)
        run: pnpm --filter @bornoland/api build

      - name: Build Next.js Web (@bornoland/web)
        run: pnpm --filter @bornoland/web build

      - name: Package production deployment artifact
        run: |
          set -euo pipefail
          echo "Packaging production artifacts..."

          ARTIFACT_DIR="build-artifact"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/apps/api" "$ARTIFACT_DIR/apps/web" "$ARTIFACT_DIR/nginx"

          # 1. Package API with production-only dependencies
          pnpm --filter @bornoland/api deploy --prod "$ARTIFACT_DIR/apps/api"
          cp -r apps/api/dist "$ARTIFACT_DIR/apps/api/"
          mkdir -p "$ARTIFACT_DIR/apps/api/uploads"

          # 2. Package Web standalone and required assets
          cp -r apps/web/.next/standalone/* "$ARTIFACT_DIR/apps/web/"
          cp -r apps/web/.next/static "$ARTIFACT_DIR/apps/web/apps/web/.next/static"
          cp -r apps/web/public "$ARTIFACT_DIR/apps/web/apps/web/public"
          echo "require('./apps/web/server.js');" > "$ARTIFACT_DIR/apps/web/server.js"

          # 3. Ecosystem & Nginx
          cp ecosystem.config.cjs "$ARTIFACT_DIR/"
          cp nginx/bornosoft.site.conf "$ARTIFACT_DIR/nginx/"

          # 4. Verify artifact contents before archiving
          test -f "$ARTIFACT_DIR/apps/api/dist/index.js" || { echo "Missing API dist/index.js"; exit 1; }
          test -f "$ARTIFACT_DIR/apps/web/apps/web/server.js" || { echo "Missing Web server.js"; exit 1; }
          test -f "$ARTIFACT_DIR/ecosystem.config.cjs" || { echo "Missing ecosystem.config.cjs"; exit 1; }
          test -f "$ARTIFACT_DIR/nginx/bornosoft.site.conf" || { echo "Missing nginx conf"; exit 1; }

          # 5. Create compressed archive
          tar -czf "release-${{ github.sha }}.tar.gz" -C "$ARTIFACT_DIR" .
          echo "Artifact created: release-${{ github.sha }}.tar.gz ($(du -h "release-${{ github.sha }}.tar.gz" | cut -f1))"

      - name: Prepare EC2 release directories
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            mkdir -p ~/bornoLand-releases/archives ~/bornoLand-releases/releases ~/bornoLand-releases/shared/uploads

      - name: Upload artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "release-${{ github.sha }}.tar.gz"
          target: "bornoLand-releases/archives"

      - name: Deploy release on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -Eeuo pipefail

            BASE_DIR="$HOME/bornoLand-releases"
            ARCHIVE_FILE="$BASE_DIR/archives/release-${{ github.sha }}.tar.gz"
            TARGET_RELEASE="$BASE_DIR/releases/release-${{ github.sha }}"
            CURRENT_LINK="$BASE_DIR/current"
            SHARED_DIR="$BASE_DIR/shared"

            # Determine previous release for rollback (if current exists)
            PREV_RELEASE=""
            if [ -L "$CURRENT_LINK" ]; then
              PREV_RELEASE=$(readlink -f "$CURRENT_LINK" || echo "")
            fi

            echo "=================================================="
            echo "🚀 STARTING ATOMIC DEPLOYMENT ON EC2"
            echo "Release: release-${{ github.sha }}"
            echo "Previous release: ${PREV_RELEASE:-None}"
            echo "=================================================="

            # 1. Migrate shared environment files if not already present
            if [ ! -f "$SHARED_DIR/api.env" ]; then
              if [ -f "$HOME/bornoLand-sass/apps/api/.env.production" ]; then
                echo "Migrating API production env to $SHARED_DIR/api.env"
                cp "$HOME/bornoLand-sass/apps/api/.env.production" "$SHARED_DIR/api.env"
              elif [ -f "$HOME/bornoLand-sass/apps/api/.env" ]; then
                cp "$HOME/bornoLand-sass/apps/api/.env" "$SHARED_DIR/api.env"
              fi
            fi

            if [ ! -f "$SHARED_DIR/web.env" ]; then
              if [ -f "$HOME/bornoLand-sass/apps/web/.env.production" ]; then
                echo "Migrating Web production env to $SHARED_DIR/web.env"
                cp "$HOME/bornoLand-sass/apps/web/.env.production" "$SHARED_DIR/web.env"
              elif [ -f "$HOME/bornoLand-sass/apps/web/.env" ]; then
                cp "$HOME/bornoLand-sass/apps/web/.env" "$SHARED_DIR/web.env"
              fi
            fi

            if [ -d "$HOME/bornoLand-sass/apps/api/uploads" ] && [ -z "$(ls -A "$SHARED_DIR/uploads" 2>/dev/null)" ]; then
              echo "Migrating existing uploads to $SHARED_DIR/uploads"
              cp -rn "$HOME/bornoLand-sass/apps/api/uploads/." "$SHARED_DIR/uploads/" 2>/dev/null || true
            fi

            # 2. Extract artifact into new release directory
            echo "📦 Extracting release artifact..."
            if [ ! -f "$ARCHIVE_FILE" ]; then
              ARCHIVE_FILE=$(find "$BASE_DIR" -name "release-${{ github.sha }}.tar.gz" 2>/dev/null | head -n 1)
            fi

            if [ -z "$ARCHIVE_FILE" ] || [ ! -f "$ARCHIVE_FILE" ]; then
              echo "ERROR: Archive not found for release-${{ github.sha }}"
              exit 1
            fi

            rm -rf "$TARGET_RELEASE"
            mkdir -p "$TARGET_RELEASE"
            tar -xzf "$ARCHIVE_FILE" -C "$TARGET_RELEASE"

            # 3. Validate extracted artifacts
            echo "🔍 Validating extracted release..."
            test -f "$TARGET_RELEASE/apps/api/dist/index.js" || { echo "API dist/index.js missing"; exit 1; }
            test -f "$TARGET_RELEASE/apps/web/apps/web/server.js" || { echo "Web server.js missing"; exit 1; }
            test -f "$TARGET_RELEASE/ecosystem.config.cjs" || { echo "ecosystem.config.cjs missing"; exit 1; }
            test -f "$TARGET_RELEASE/nginx/bornosoft.site.conf" || { echo "Nginx config missing"; exit 1; }

            # 4. Symlink shared environment variables & persistent uploads
            echo "🔗 Linking shared environment files and uploads..."
            if [ -f "$SHARED_DIR/api.env" ]; then
              ln -sf "$SHARED_DIR/api.env" "$TARGET_RELEASE/apps/api/.env.production"
              ln -sf "$SHARED_DIR/api.env" "$TARGET_RELEASE/apps/api/.env"
            fi

            if [ -f "$SHARED_DIR/web.env" ]; then
              ln -sf "$SHARED_DIR/web.env" "$TARGET_RELEASE/apps/web/apps/web/.env.production"
              ln -sf "$SHARED_DIR/web.env" "$TARGET_RELEASE/apps/web/.env.production"
            fi

            rm -rf "$TARGET_RELEASE/apps/api/uploads"
            ln -sf "$SHARED_DIR/uploads" "$TARGET_RELEASE/apps/api/uploads"

            # 5. Validate Nginx configuration
            echo "🌐 Validating Nginx configuration..."
            SSL_CERT="/etc/letsencrypt/live/bornosoft.site/fullchain.pem"
            SSL_KEY="/etc/letsencrypt/live/bornosoft.site/privkey.pem"

            if ! sudo test -f "$SSL_CERT" || ! sudo test -f "$SSL_KEY"; then
              echo "ERROR: SSL certificates missing at $SSL_CERT / $SSL_KEY"
              exit 1
            fi

            NGINX_TARGET="/etc/nginx/sites-available/bornosoft.site"
            NGINX_BACKUP="/etc/nginx/sites-available/bornosoft.site.bak"

            if [ -f "$NGINX_TARGET" ]; then
              sudo cp "$NGINX_TARGET" "$NGINX_BACKUP"
            fi

            sudo cp "$TARGET_RELEASE/nginx/bornosoft.site.conf" "$NGINX_TARGET"
            sudo ln -sf "$NGINX_TARGET" /etc/nginx/sites-enabled/bornosoft.site
            sudo rm -f /etc/nginx/sites-enabled/default

            if ! sudo nginx -t; then
              echo "ERROR: Nginx syntax check failed. Reverting Nginx config..."
              if [ -f "$NGINX_BACKUP" ]; then
                sudo cp "$NGINX_BACKUP" "$NGINX_TARGET"
                sudo nginx -t || true
              fi
              exit 1
            fi

            # Rollback function in case PM2 or health checks fail
            rollback() {
              local exit_code=$?
              echo ""
              echo "=================================================="
              echo "⚠️ DEPLOYMENT FAILED (exit code: $exit_code)"
              echo "⚠️ INITIATING AUTOMATIC ROLLBACK..."
              echo "=================================================="

              if [ -n "$PREV_RELEASE" ] && [ -d "$PREV_RELEASE" ]; then
                echo "Restoring previous release symlink: $PREV_RELEASE"
                ln -sfn "$PREV_RELEASE" "$CURRENT_LINK"

                if [ -f "$PREV_RELEASE/nginx/bornosoft.site.conf" ]; then
                  sudo cp "$PREV_RELEASE/nginx/bornosoft.site.conf" "$NGINX_TARGET"
                  sudo nginx -t && sudo systemctl reload nginx || true
                fi

                echo "Restoring PM2 processes with previous release..."
                if [ -f "$PREV_RELEASE/ecosystem.config.cjs" ]; then
                  pm2 restart "$PREV_RELEASE/ecosystem.config.cjs" --update-env || true
                  pm2 save || true
                fi

                echo "✓ Rollback complete. Previous release active."
              else
                echo "⚠️ No previous release directory found to rollback to."
              fi

              echo ""
              echo "=== PM2 STATUS ==="
              pm2 status || true
              echo ""
              echo "=== API LOGS ==="
              pm2 logs bornoland-api --lines 40 --nostream || true
              echo ""
              echo "=== WEB LOGS ==="
              pm2 logs bornoland-web --lines 40 --nostream || true
              echo ""
              echo "=== NGINX ERROR LOGS ==="
              sudo tail -n 40 /var/log/nginx/error.log || true

              exit "$exit_code"
            }

            trap rollback ERR

            # 6. Switch current symlink atomically
            echo "🔄 Switching release symlink atomically..."
            ln -sfn "$TARGET_RELEASE" "$CURRENT_LINK"

            # 7. Reload Nginx
            echo "🔄 Reloading Nginx..."
            sudo systemctl reload nginx
            sudo rm -f "$NGINX_BACKUP"

            # 8. Start / Reload PM2 processes
            echo "🚀 Starting / reloading PM2 processes..."
            if pm2 describe bornoland-api >/dev/null 2>&1; then
              pm2 restart "$CURRENT_LINK/ecosystem.config.cjs" --update-env
            else
              pm2 start "$CURRENT_LINK/ecosystem.config.cjs"
            fi
            pm2 save

            # 9. Health checks with retries
            echo "=================================================="
            echo "🩺 RUNNING POST-DEPLOYMENT HEALTH CHECKS"
            echo "=================================================="

            run_health_check() {
              local name="$1"
              local cmd="$2"
              local retries=30
              local count=1

              echo -n "Checking $name... "
              while [ "$count" -le "$retries" ]; do
                if eval "$cmd" >/dev/null 2>&1; then
                  echo "✓ OK (${count}s)"
                  return 0
                fi
                sleep 1
                count=$((count + 1))
              done

              echo "✗ FAILED"
              return 1
            }

            run_health_check \
              "Next.js Web Direct (:3000)" \
              "curl -fsS http://127.0.0.1:3000/"

            run_health_check \
              "Express API Direct (:4000)" \
              "curl -fsS http://127.0.0.1:4000/"

            run_health_check \
              "HTTPS Root (bornosoft.site)" \
              "curl -k -fsS --resolve bornosoft.site:443:127.0.0.1 https://bornosoft.site/"

            run_health_check \
              "HTTPS Tenant (nayeem.bornosoft.site)" \
              "curl -k -fsS --resolve nayeem.bornosoft.site:443:127.0.0.1 https://nayeem.bornosoft.site/"

            run_health_check \
              "HTTP to HTTPS 301 Redirect" \
              'test "$(curl -s -o /dev/null -w "%{http_code}" -H "Host: bornosoft.site" http://127.0.0.1/)" = "301"'

            # Trap is no longer needed after successful health checks
            trap - ERR

            # 10. Prune old releases (keep current + last 2)
            echo "=================================================="
            echo "🧹 PRUNING OLD RELEASES"
            echo "=================================================="
            cd "$BASE_DIR/releases"
            ls -1td release-* 2>/dev/null | tail -n +4 | while read -r old_release; do
              if [ -d "$old_release" ] && [ "$(readlink -f "$old_release")" != "$(readlink -f "$CURRENT_LINK")" ]; then
                echo "Removing old release: $old_release"
                rm -rf "$old_release"
              fi
            done

            cd "$BASE_DIR/archives"
            ls -1td release-*.tar.gz 2>/dev/null | tail -n +4 | while read -r old_archive; do
              echo "Removing old archive: $old_archive"
              rm -f "$old_archive"
            done

            echo "=================================================="
            echo "🎉 DEPLOYMENT SUCCEEDED"
            echo "Active release: $(readlink -f "$CURRENT_LINK")"
            echo "=================================================="
            pm2 status