- name: Deploy to EC2
  uses: appleboy/ssh-action@v1.2.2
  with:
    host: ${{ secrets.EC2_HOST }}
    username: ${{ secrets.EC2_USER }}
    key: ${{ secrets.EC2_SSH_KEY }}
    port: 22
    script_stop: true

    script: |
      set -e

      cd ~/bornoLand-sass

      echo "=== Pull latest code ==="
      git fetch origin main
      git checkout main
      git reset --hard origin/main

      echo "=== Install dependencies ==="
      pnpm install --frozen-lockfile

      echo "=== Remove production local env ==="
      rm -f apps/web/.env.local

      echo "=== Clean Next.js build ==="
      rm -rf apps/web/.next

      echo "=== Build frontend + backend ==="
      pnpm build

      echo "=== Restart API ==="
      pm2 restart bornoland-api --update-env

      echo "=== Restart Web ==="
      pm2 restart bornoland-web --update-env

      echo "=== Save PM2 ==="
      pm2 save

      echo "=== PM2 Status ==="
      pm2 status

      echo "=== DEPLOY SUCCESS ==="