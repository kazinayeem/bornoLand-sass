name: BornoLand CI/CD

on:
  push:
    branches: [main]

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |
            set -Eeuo pipefail

            REPO_DIR="$HOME/bornoLand-sass"

            echo ""
            echo "========================================="
            echo "       BornoLand Deployment"
            echo "========================================="
            echo "Time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo ""

            # =====================================================
            # 0. VERIFY EXISTING SERVER RUNTIME
            # =====================================================

            echo "--- Runtime ---"

            if ! command -v node >/dev/null 2>&1; then
              echo "ERROR: Node.js is not installed on EC2."
              exit 1
            fi

            if ! command -v pnpm >/dev/null 2>&1; then
              echo "ERROR: pnpm is not installed on EC2."
              exit 1
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "ERROR: PM2 is not installed on EC2."
              exit 1
            fi

            echo "Node: $(node --version)"
            echo "pnpm: $(pnpm --version)"
            echo "PM2:  $(pm2 --version)"
            echo ""

            # =====================================================
            # 1. UPDATE CODE
            # =====================================================

            echo "--- Step 1: Git update ---"

            cd "$REPO_DIR"

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "Commit: $(git rev-parse --short HEAD)"
            echo "✓ Code updated"

            # =====================================================
            # 2. INSTALL DEPENDENCIES
            # =====================================================

            echo ""
            echo "--- Step 2: Install dependencies ---"

            pnpm install --frozen-lockfile

            echo "✓ Dependencies installed"

            # =====================================================
            # 3. STOP PM2
            # =====================================================

            echo ""
            echo "--- Step 3: Stop PM2 ---"

            pm2 stop bornoland-api bornoland-web 2>/dev/null || true

            echo "✓ PM2 stopped"

            # =====================================================
            # FAILURE RECOVERY
            # =====================================================

            deployment_failed() {
              CODE=$?

              echo ""
              echo "========================================="
              echo "       DEPLOYMENT FAILED"
              echo "       Exit code: $CODE"
              echo "========================================="

              echo ""
              echo "--- Restoring PM2 ---"

              pm2 restart bornoland-api --update-env 2>/dev/null || true
              pm2 restart bornoland-web --update-env 2>/dev/null || true
              pm2 save 2>/dev/null || true

              echo ""
              pm2 status || true

              exit "$CODE"
            }

            trap deployment_failed ERR

            # =====================================================
            # 4. BUILD API
            # =====================================================

            echo ""
            echo "--- Step 4: Build API ---"

            cd "$REPO_DIR"

            pnpm --filter @bornoland/api build

            echo "✓ API build completed"

            # Verify API output
            if [ ! -d "$REPO_DIR/apps/api/dist" ]; then
              echo "ERROR: API dist directory not found"
              exit 1
            fi

            echo "✓ API dist verified"

            # =====================================================
            # 5. BUILD WEB
            # =====================================================

            echo ""
            echo "--- Step 5: Build Web ---"

            pnpm --filter @bornoland/web build

            echo "✓ Web build completed"

            if [ ! -d "$REPO_DIR/apps/web/.next" ]; then
              echo "ERROR: Next.js .next directory not found"
              exit 1
            fi

            echo "✓ Web build verified"

            # =====================================================
            # 6. NGINX
            # =====================================================

            echo ""
            echo "--- Step 6: Nginx ---"

            NGINX_CONF="/etc/nginx/sites-available/bornosoft.site"
            NGINX_BACKUP="${NGINX_CONF}.backup"

            # SSL must already exist
            if ! sudo test -f \
              "/etc/letsencrypt/live/bornosoft.site/fullchain.pem"
            then
              echo "ERROR: SSL fullchain missing"
              exit 1
            fi

            if ! sudo test -f \
              "/etc/letsencrypt/live/bornosoft.site/privkey.pem"
            then
              echo "ERROR: SSL private key missing"
              exit 1
            fi

            echo "✓ SSL certificates found"

            # Backup current config
            if sudo test -f "$NGINX_CONF"; then
              sudo cp "$NGINX_CONF" "$NGINX_BACKUP"
            fi

            # Install repository Nginx config
            sudo cp \
              "$REPO_DIR/nginx/bornosoft.site.conf" \
              "$NGINX_CONF"

            sudo ln -sf \
              "$NGINX_CONF" \
              /etc/nginx/sites-enabled/bornosoft.site

            # Remove default site
            sudo rm -f \
              /etc/nginx/sites-enabled/default 2>/dev/null || true

            # ALWAYS validate before reload
            if sudo nginx -t; then

              echo "✓ Nginx config valid"

              sudo systemctl reload nginx

              echo "✓ Nginx reloaded"

              sudo rm -f "$NGINX_BACKUP"

            else

              echo "ERROR: Nginx config invalid"

              if sudo test -f "$NGINX_BACKUP"; then
                sudo cp "$NGINX_BACKUP" "$NGINX_CONF"

                echo "✓ Previous Nginx config restored"
              fi

              exit 1
            fi

            # =====================================================
            # 7. RESTART PM2
            # =====================================================

            echo ""
            echo "--- Step 7: PM2 restart ---"

            pm2 restart bornoland-api --update-env
            pm2 restart bornoland-web --update-env

            pm2 save

            echo ""
            pm2 status

            echo ""
            echo "✓ PM2 restarted"

            # =====================================================
            # 8. HEALTH CHECK
            # =====================================================

            echo ""
            echo "--- Step 8: Health checks ---"

            sleep 5

            check_url() {
              NAME="$1"
              URL="$2"

              echo -n "$NAME: "

              if curl \
                --fail \
                --silent \
                --show-error \
                --max-time 10 \
                "$URL" \
                >/dev/null
              then
                echo "✓ OK"
                return 0
              fi

              echo "✗ FAILED"
              return 1
            }

            FAILED=0

            check_url \
              "API" \
              "http://127.0.0.1:4000/" || FAILED=1

            check_url \
              "Web" \
              "http://127.0.0.1:3000/" || FAILED=1

            check_url \
              "HTTPS bornosoft.site" \
              "https://bornosoft.site/" || FAILED=1

            check_url \
              "HTTPS nayeem.bornosoft.site" \
              "https://nayeem.bornosoft.site/" || FAILED=1

            # =====================================================
            # 9. FAILURE DIAGNOSTICS
            # =====================================================

            if [ "$FAILED" -ne 0 ]; then

              echo ""
              echo "========================================="
              echo "       HEALTH CHECK FAILED"
              echo "========================================="

              echo ""
              echo "--- PM2 ---"
              pm2 status || true

              echo ""
              echo "--- API logs ---"
              pm2 logs bornoland-api \
                --lines 50 \
                --nostream \
                2>/dev/null || true

              echo ""
              echo "--- Web logs ---"
              pm2 logs bornoland-web \
                --lines 50 \
                --nostream \
                2>/dev/null || true

              echo ""
              echo "--- Nginx errors ---"
              sudo tail -n 50 \
                /var/log/nginx/error.log \
                2>/dev/null || true

              exit 1
            fi

            # =====================================================
            # SUCCESS
            # =====================================================

            echo ""
            echo "========================================="
            echo "       DEPLOYMENT SUCCESS"
            echo "========================================="

            echo "Commit: $(git rev-parse --short HEAD)"
            echo "Node:   $(node --version)"
            echo "pnpm:   $(pnpm --version)"
            echo ""
            echo "API:    http://127.0.0.1:4000/"
            echo "Web:    http://127.0.0.1:3000/"
            echo "HTTPS:  https://bornosoft.site/"
            echo ""
            echo "========================================="