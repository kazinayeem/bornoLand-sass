# ==============================================================================
# BornoLand Production Nginx Configuration
# Domains:
#   - bornosoft.site        (Platform SaaS landing / marketing)
#   - www.bornosoft.site    (Platform SaaS landing / marketing)
#   - *.bornosoft.site      (Tenant store subdomains, e.g. nayeem.bornosoft.site)
#   - api.bornosoft.site    (Express REST API backend)
#
# Reverse Proxy Targets:
#   - Web frontend (Next.js) : 127.0.0.1:3000
#   - API backend  (Express) : 127.0.0.1:4000
#
# Managed via Git CI/CD — Deployed to /etc/nginx/sites-available/bornosoft.site
# ==============================================================================

upstream bornoland_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream bornoland_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP (:80) — Frontend: Platform root, www, and tenant subdomains
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name bornosoft.site www.bornosoft.site *.bornosoft.site;

    client_max_body_size 25m;

    # Direct /api/ traffic straight to Express API (avoids extra Next.js hop)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://bornoland_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket / Upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # All frontend traffic -> Next.js (Platform root & tenant subdomains)
    location / {
        proxy_pass http://bornoland_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket / Upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTP (:80) — Dedicated API Subdomain
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.bornosoft.site;

    client_max_body_size 25m;

    location / {
        proxy_pass http://bornoland_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket / Upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 3. HTTPS (:443) — Frontend: Platform root, www, and tenant subdomains
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name bornosoft.site www.bornosoft.site *.bornosoft.site;

    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/bornosoft.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bornosoft.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Direct /api/ traffic straight to Express API
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://bornoland_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket / Upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # All frontend traffic -> Next.js (Platform root & tenant subdomains)
    location / {
        proxy_pass http://bornoland_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket / Upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 4. HTTPS (:443) — Dedicated API Subdomain
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name api.bornosoft.site;

    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/bornosoft.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bornosoft.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass http://bornoland_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket / Upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
