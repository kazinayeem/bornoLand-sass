name: BornoLand CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true

          script: |
            set -e

            echo "========================================"
            echo "       Starting BornoLand deployment"
            echo "========================================"

            # ----------------------------------------------------
            # 1. SSH to EC2 & navigate to repo
            # ----------------------------------------------------
            cd ~/bornoLand-sass

            # ----------------------------------------------------
            # 2. Fetch latest code
            # ----------------------------------------------------
            echo ""
            echo "=== 2. Fetch latest code ==="
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # ----------------------------------------------------
            # 3. Install dependencies
            # ----------------------------------------------------
            echo ""
            echo "=== 3. Install dependencies ==="
            pnpm install --no-frozen-lockfile

            # ----------------------------------------------------
            # 4. Remove production local env override
            # ----------------------------------------------------
            echo ""
            echo "=== 4. Remove production .env.local ==="
            rm -f apps/web/.env.local

            # ----------------------------------------------------
            # 5. Clean Next.js build
            # ----------------------------------------------------
            echo ""
            echo "=== 5. Clean Next.js build ==="
            rm -rf apps/web/.next

            # ----------------------------------------------------
            # 6. Build frontend + backend
            # ----------------------------------------------------
            echo ""
            echo "=== 6. Build frontend + backend ==="
            pnpm build

            # ----------------------------------------------------
            # 7. Safely install Nginx configuration
            # ----------------------------------------------------
            echo ""
            echo "=== 7. Safely install Nginx configuration ==="

            SSL_CERT="/etc/letsencrypt/live/bornosoft.site/fullchain.pem"
            SSL_KEY="/etc/letsencrypt/live/bornosoft.site/privkey.pem"

            # Verify that SSL certificates exist (using sudo to access root-owned letsencrypt directory)
            if ! sudo test -f "$SSL_CERT" || ! sudo test -f "$SSL_KEY"; then
              echo "  ✗ ERROR: SSL certificate or key not found at $SSL_CERT / $SSL_KEY!"
              echo "  Cannot install production Nginx configuration without valid SSL certificate files."
              exit 1
            fi
            echo "  ✓ Confirmed SSL certificate and key exist at $SSL_CERT"

            # Atomic backup: preserve existing working configuration before replacing
            if [ -f /etc/nginx/sites-available/bornosoft.site ]; then
              sudo cp /etc/nginx/sites-available/bornosoft.site /etc/nginx/sites-available/bornosoft.site.bak
            fi

            # Copy clean repository Nginx configuration
            sudo cp nginx/bornosoft.site.conf /etc/nginx/sites-available/bornosoft.site

            # Create / update symlink to sites-enabled
            sudo ln -sf /etc/nginx/sites-available/bornosoft.site /etc/nginx/sites-enabled/bornosoft.site

            # Remove default Nginx site symlink if present
            if [ -L /etc/nginx/sites-enabled/default ]; then
              echo "  Removing default Nginx installation symlink"
              sudo rm -f /etc/nginx/sites-enabled/default
            fi

            # ----------------------------------------------------
            # 8. Validate Nginx configuration
            # ----------------------------------------------------
            echo ""
            echo "=== 8. Validate Nginx configuration ==="
            if ! sudo nginx -t; then
              echo ""
              echo "  ✗ NGINX CONFIGURATION VALIDATION FAILED!"
              echo "  Rolling back to previous Nginx configuration..."
              if [ -f /etc/nginx/sites-available/bornosoft.site.bak ]; then
                sudo cp /etc/nginx/sites-available/bornosoft.site.bak /etc/nginx/sites-available/bornosoft.site
                sudo ln -sf /etc/nginx/sites-available/bornosoft.site /etc/nginx/sites-enabled/bornosoft.site
                echo "  Restored previous working Nginx configuration."
                sudo nginx -t || true
              fi
              echo "  Aborting deployment without reloading Nginx."
              exit 1
            fi
            echo "  ✓ Nginx configuration syntax is valid"

            # Clean up backup file now that validation succeeded
            sudo rm -f /etc/nginx/sites-available/bornosoft.site.bak

            # ----------------------------------------------------
            # 9. Reload Nginx
            # ----------------------------------------------------
            echo ""
            echo "=== 9. Reload Nginx ==="
            sudo systemctl reload nginx
            echo "  ✓ Nginx reloaded successfully"

            # ----------------------------------------------------
            # 10. Restart API
            # ----------------------------------------------------
            echo ""
            echo "=== 10. Restart API ==="
            pm2 restart bornoland-api --update-env

            # ----------------------------------------------------
            # 11. Restart Web
            # ----------------------------------------------------
            echo ""
            echo "=== 11. Restart Web ==="
            pm2 restart bornoland-web --update-env

            # ----------------------------------------------------
            # 12. Save PM2 configuration
            # ----------------------------------------------------
            echo ""
            echo "=== 12. Save PM2 configuration ==="
            pm2 save
            pm2 status

            # ----------------------------------------------------
            # 13. Health tests
            # ----------------------------------------------------
            echo ""
            echo "=== 13. Running health tests ==="

            run_health_check() {
              local name="$1"
              local cmd="$2"
              local max_retries=20
              local count=1

              echo "Checking $name..."

              while [ $count -le $max_retries ]; do
                if eval "$cmd" >/dev/null 2>&1; then
                  echo "  ✓ $name is healthy (attempt $count)"
                  return 0
                fi
                sleep 1
                count=$((count + 1))
              done

              echo "  ✗ $name failed health check after $max_retries attempts!"
              return 1
            }

            failed=0

            # 1. Direct Next.js check (port 3000)
            run_health_check "Next.js Direct (127.0.0.1:3000)" "curl -fsS http://127.0.0.1:3000/" || failed=1

            # 2. Direct Express API check (port 4000)
            run_health_check "Express API Direct (127.0.0.1:4000)" "curl -fsS http://127.0.0.1:4000/" || failed=1

            # 3. Nginx HTTPS Root check (443 with SNI bornosoft.site)
            run_health_check "Nginx HTTPS Root (bornosoft.site)" "curl -k -fsS --resolve bornosoft.site:443:127.0.0.1 https://bornosoft.site/" || failed=1

            # 4. Nginx HTTPS Tenant check (443 with SNI nayeem.bornosoft.site)
            run_health_check "Nginx HTTPS Tenant (nayeem.bornosoft.site)" "curl -k -fsS --resolve nayeem.bornosoft.site:443:127.0.0.1 https://nayeem.bornosoft.site/" || failed=1

            # 5. Nginx HTTP -> HTTPS 301 redirect check (port 80)
            run_health_check "Nginx HTTP to HTTPS 301 Redirect" 'test "$(curl -s -o /dev/null -w "%{http_code}" -H "Host: bornosoft.site" http://127.0.0.1/)" = "301"' || failed=1

            if [ $failed -ne 0 ]; then
              echo ""
              echo "========================================"
              echo "        HEALTH CHECK FAILURE DIAGNOSTICS"
              echo "========================================"
              echo ""
              echo "=== NGINX STATUS ==="
              sudo systemctl status nginx --no-pager || true
              echo ""
              echo "=== PM2 STATUS ==="
              pm2 status || true
              echo ""
              echo "=== RECENT NGINX ERROR LOG ==="
              sudo tail -n 50 /var/log/nginx/error.log || true
              echo ""
              echo "=== RECENT PM2 WEB LOGS ==="
              pm2 logs bornoland-web --lines 50 --nostream || true
              echo ""
              echo "=== RECENT PM2 API LOGS ==="
              pm2 logs bornoland-api --lines 50 --nostream || true
              echo ""
              echo "Deployment failed due to health check errors!"
              exit 1
            fi

            echo ""
            echo "========================================"
            echo "       DEPLOYMENT SUCCESS"
            echo "========================================"