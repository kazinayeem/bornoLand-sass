name: BornoLand CI/CD

on:
  push:
    branches: [main]

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |
            set -Eeuo pipefail

            REPO_DIR="$HOME/bornoLand-sass"
            NVM_DIR="$HOME/.nvm"

            echo ""
            echo "========================================="
            echo "  BornoLand Deploy"
            echo "  $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "========================================="

            # =====================================================
            # 0. BASIC SYSTEM INFO
            # =====================================================

            echo ""
            echo "--- System ---"
            free -h || true
            echo ""

            # =====================================================
            # 1. GIT UPDATE
            # =====================================================

            echo ""
            echo "--- Step 1: Git update ---"

            cd "$REPO_DIR"

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "✓ Code updated to $(git rev-parse --short HEAD)"

            # =====================================================
            # 2. STOP PM2 BEFORE ANY NODE/NVM INSTALL
            # IMPORTANT:
            # This must happen BEFORE nvm/node installation.
            # =====================================================

            echo ""
            echo "--- Step 2: Stop PM2 ---"

            pm2 stop bornoland-api bornoland-web 2>/dev/null || true

            echo "✓ PM2 stopped"

            echo ""
            pm2 status || true

            # =====================================================
            # BUILD/DEPLOY FAILURE RECOVERY
            # =====================================================

            restore_pm2() {
              local code=$?

              echo ""
              echo "========================================="
              echo "  DEPLOYMENT FAILED"
              echo "  Exit code: ${code}"
              echo "  Restoring PM2..."
              echo "========================================="

              pm2 restart bornoland-api --update-env 2>/dev/null || true
              pm2 restart bornoland-web --update-env 2>/dev/null || true
              pm2 save 2>/dev/null || true

              echo ""
              pm2 status || true

              exit "$code"
            }

            trap restore_pm2 ERR

            # =====================================================
            # 3. BOOTSTRAP NVM
            # ONLY IF MISSING
            # =====================================================

            echo ""
            echo "--- Step 3: Ensure nvm ---"

            export NVM_DIR="$HOME/.nvm"

            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "nvm not found."
              echo "Installing nvm..."

              mkdir -p "$NVM_DIR"

              # Download installer first.
              # Do NOT pipe curl directly into bash.
              # This gives clearer failure handling.
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --retry 3 \
                --retry-delay 2 \
                https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh \
                -o /tmp/nvm-install.sh

              bash /tmp/nvm-install.sh

              rm -f /tmp/nvm-install.sh

              if [ ! -s "$NVM_DIR/nvm.sh" ]; then
                echo "FATAL: nvm installation failed"
                exit 1
              fi

              echo "✓ nvm installed"
            else
              echo "✓ nvm already installed"
            fi

            # Load nvm into THIS SSH shell
            . "$NVM_DIR/nvm.sh"

            if ! command -v nvm >/dev/null 2>&1; then
              echo "FATAL: nvm command unavailable after loading"
              exit 1
            fi

            echo "nvm: $(nvm --version)"

            # =====================================================
            # 4. ENSURE NODE 22
            # =====================================================

            echo ""
            echo "--- Step 4: Ensure Node 22 ---"

            if ! nvm ls 22 2>/dev/null | grep -q "v22"; then
              echo "Node 22 not found."
              echo "Installing Node 22..."

              nvm install 22
            else
              echo "✓ Node 22 already installed"
            fi

            nvm use 22
            nvm alias default 22

            hash -r

            NODE_VERSION="$(node --version)"
            NODE_MAJOR="$(node -p 'process.versions.node.split(".")[0]')"

            echo "Node: $NODE_VERSION"
            echo "Node path: $(command -v node)"

            if [ "$NODE_MAJOR" != "22" ]; then
              echo "FATAL: Node 22 required, found $NODE_VERSION"
              exit 1
            fi

            echo "✓ Node 22 active"

            # =====================================================
            # 5. ENSURE PNPM 9.12.0
            # =====================================================

            echo ""
            echo "--- Step 5: Ensure pnpm 9.12.0 ---"

            REQUIRED_PNPM="9.12.0"

            CURRENT_PNPM="$(pnpm --version 2>/dev/null || echo "")"

            echo "Current pnpm: ${CURRENT_PNPM:-none}"

            if [ "$CURRENT_PNPM" != "$REQUIRED_PNPM" ]; then
              echo "Installing pnpm $REQUIRED_PNPM..."

              npm install -g "pnpm@$REQUIRED_PNPM"

              hash -r
            fi

            PNPM_VERSION="$(pnpm --version)"

            echo "pnpm: $PNPM_VERSION"
            echo "pnpm path: $(command -v pnpm)"

            if [ "$PNPM_VERSION" != "$REQUIRED_PNPM" ]; then
              echo "FATAL: pnpm $REQUIRED_PNPM required, found $PNPM_VERSION"
              exit 1
            fi

            echo "✓ pnpm 9.12.0 active"

            # =====================================================
            # 6. FINAL RUNTIME CHECK
            # =====================================================

            echo ""
            echo "========================================="
            echo "  RUNTIME"
            echo "========================================="

            echo "Node:       $(node --version)"
            echo "pnpm:       $(pnpm --version)"
            echo "node path:  $(command -v node)"
            echo "pnpm path:  $(command -v pnpm)"

            echo "========================================="

            # Limit Node heap during builds.
            # This is NOT used for normal PM2 runtime.
            export NODE_OPTIONS="--max-old-space-size=2048"

            # =====================================================
            # 7. INSTALL DEPENDENCIES
            # =====================================================

            echo ""
            echo "--- Step 6: Install dependencies ---"

            cd "$REPO_DIR"

            pnpm install --frozen-lockfile

            echo "✓ Dependencies installed"

            # =====================================================
            # 8. BUILD API
            # =====================================================

            echo ""
            echo "--- Step 7: Build API ---"

            cd "$REPO_DIR/apps/api"

            rm -rf dist

            pnpm build

            if [ ! -f "$REPO_DIR/apps/api/dist/index.js" ]; then
              echo "FATAL: API build output missing"
              find "$REPO_DIR/apps/api/dist" -maxdepth 2 -type f 2>/dev/null || true
              exit 1
            fi

            echo "✓ API built"

            # =====================================================
            # 9. BUILD WEB
            # =====================================================

            echo ""
            echo "--- Step 8: Build Web ---"

            cd "$REPO_DIR/apps/web"

            rm -rf .next

            pnpm build

            if [ ! -d "$REPO_DIR/apps/web/.next" ]; then
              echo "FATAL: Next.js build output missing"
              exit 1
            fi

            echo "✓ Web built"

            # =====================================================
            # 10. NGINX
            # =====================================================

            echo ""
            echo "--- Step 9: Nginx ---"

            NGINX_CONF="/etc/nginx/sites-available/bornosoft.site"
            NGINX_BACKUP="${NGINX_CONF}.bak"

            for cert in \
              "/etc/letsencrypt/live/bornosoft.site/fullchain.pem" \
              "/etc/letsencrypt/live/bornosoft.site/privkey.pem"
            do
              if ! sudo test -f "$cert"; then
                echo "FATAL: SSL file missing: $cert"
                exit 1
              fi
            done

            echo "✓ SSL certificates present"

            # Backup current config
            if sudo test -f "$NGINX_CONF"; then
              sudo cp "$NGINX_CONF" "$NGINX_BACKUP"
            fi

            # Install repository config
            sudo cp \
              "$REPO_DIR/nginx/bornosoft.site.conf" \
              "$NGINX_CONF"

            sudo ln -sf \
              "$NGINX_CONF" \
              /etc/nginx/sites-enabled/bornosoft.site

            # Remove default site if enabled
            if [ -L /etc/nginx/sites-enabled/default ]; then
              sudo rm -f /etc/nginx/sites-enabled/default
            fi

            # Test before reload
            if sudo nginx -t; then
              echo "✓ Nginx config valid"

              sudo systemctl reload nginx

              sudo rm -f "$NGINX_BACKUP"

              echo "✓ Nginx reloaded"
            else
              echo "✗ Nginx config invalid"

              if sudo test -f "$NGINX_BACKUP"; then
                sudo cp "$NGINX_BACKUP" "$NGINX_CONF"

                if sudo nginx -t; then
                  echo "✓ Previous Nginx config restored"
                fi
              fi

              exit 1
            fi

            # =====================================================
            # 11. PM2 RESTART
            # =====================================================

            echo ""
            echo "--- Step 10: PM2 restart ---"

            pm2 restart bornoland-api --update-env
            pm2 restart bornoland-web --update-env

            pm2 save

            sleep 3

            pm2 status

            echo "✓ PM2 restarted"

            # =====================================================
            # SUCCESSFUL DEPLOYMENT
            # Disable recovery trap
            # =====================================================

            trap - ERR

            # =====================================================
            # 12. HEALTH CHECKS
            # =====================================================

            echo ""
            echo "--- Step 11: Health checks ---"

            health_check() {
              local name="$1"
              local url="$2"
              local max=30
              local i=1

              printf "  %-42s " "${name}..."

              while [ "$i" -le "$max" ]; do
                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  --max-time 5 \
                  "$url" \
                  >/dev/null 2>&1
                then
                  echo "✓ OK (${i}s)"
                  return 0
                fi

                sleep 1
                i=$((i + 1))
              done

              echo "✗ FAILED after ${max}s"
              return 1
            }

            FAILED=0

            health_check \
              "API http://127.0.0.1:4000/" \
              "http://127.0.0.1:4000/" || FAILED=1

            health_check \
              "Web http://127.0.0.1:3000/" \
              "http://127.0.0.1:3000/" || FAILED=1

            health_check \
              "HTTPS bornosoft.site" \
              "https://bornosoft.site/" || FAILED=1

            health_check \
              "HTTPS nayeem.bornosoft.site" \
              "https://nayeem.bornosoft.site/" || FAILED=1

            if [ "$FAILED" -ne 0 ]; then

              echo ""
              echo "========================================="
              echo "  HEALTH CHECK FAILED"
              echo "========================================="

              echo ""
              echo "=== PM2 ==="
              pm2 status || true

              echo ""
              echo "=== API LOGS ==="
              pm2 logs bornoland-api \
                --lines 40 \
                --nostream \
                2>/dev/null || true

              echo ""
              echo "=== WEB LOGS ==="
              pm2 logs bornoland-web \
                --lines 40 \
                --nostream \
                2>/dev/null || true

              echo ""
              echo "=== NGINX ERRORS ==="
              sudo tail -n 40 \
                /var/log/nginx/error.log \
                2>/dev/null || true

              exit 1
            fi

            # =====================================================
            # FINAL
            # =====================================================

            echo ""
            echo "========================================="
            echo "  DEPLOYMENT SUCCESS"
            echo "========================================="

            echo "Commit: $(git rev-parse --short HEAD)"
            echo "Node:   $(node --version)"
            echo "pnpm:   $(pnpm --version)"
            echo "API:    http://127.0.0.1:4000/"
            echo "Web:    http://127.0.0.1:3000/"
            echo "HTTPS:  https://bornosoft.site/"
            echo ""