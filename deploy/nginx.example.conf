# Example Nginx reverse proxy for AWS EC2 + Docker Compose
# Place behind your domain (HTTPS via Certbot recommended).
#
# Upstream containers publish:
#   frontend → 127.0.0.1:3000
#   backend  → 127.0.0.1:4000
#
# Recommended public layout:
#   https://bornosoft.site        → frontend
#   https://api.bornosoft.site    → backend (optional; /api on web also works)

upstream bornoland_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream bornoland_api {
  server 127.0.0.1:4000;
  keepalive 32;
}

server {
  listen 80;
  server_name bornosoft.site www.bornosoft.site;

  client_max_body_size 25m;

  # Optional: terminate TLS with certbot, then proxy to containers over HTTP locally
  location / {
    proxy_pass http://bornoland_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Same-origin API path (matches NEXT_PUBLIC_API_URL=/api)
  # Prefer proxying /api straight to backend to avoid an extra hop through Next.
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://bornoland_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

server {
  listen 80;
  server_name api.bornosoft.site;

  client_max_body_size 25m;

  location / {
    proxy_pass http://bornoland_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
