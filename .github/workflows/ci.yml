name: BornoLand CI/CD

# ======================================================================
# Architecture:
#   Job 1 (build) — runs on GitHub runner (unlimited RAM, ephemeral)
#     → checkout, pnpm install, tsup API build, next build (standalone)
#     → package tarball: api/dist + api/node_modules(prod) + web/standalone
#     → upload tarball to GitHub Actions artifacts
#
#   Job 2 (deploy) — runs on GitHub runner, connects to EC2 via SCP+SSH
#     → SCP tarball to EC2 /tmp/
#     → SSH: extract → validate → copy env → nginx → symlink → pm2 reload
#     → health checks (30s retry)
#     → automatic rollback on any failure
#
# EC2 NEVER runs: pnpm install / tsup / next build / tsc / esbuild
# ======================================================================

on:
  push:
    branches: [main]

env:
  # Must match packageManager field in root package.json
  PNPM_VERSION: '9.12.0'
  # Must match .nvmrc
  NODE_VERSION: '22'

jobs:
  # ====================================================================
  # JOB 1 — BUILD (GitHub runner, unlimited RAM)
  # ====================================================================
  build:
    name: Build
    runs-on: ubuntu-latest

    outputs:
      release_sha: ${{ steps.sha.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ── pnpm ──────────────────────────────────────────────────────────
      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── API Build ─────────────────────────────────────────────────────
      - name: Build API (tsup)
        run: pnpm --filter @bornoland/api build

      - name: Validate API artifact
        run: |
          if [ ! -f apps/api/dist/index.js ]; then
            echo "✗ API dist/index.js not found"
            ls -la apps/api/dist/ || true
            exit 1
          fi
          echo "✓ API artifact: $(ls -lh apps/api/dist/index.js)"

      # ── Web Build ─────────────────────────────────────────────────────
      # NEXT_PUBLIC_* are baked into the bundle at build time.
      # Add these as GitHub Repository Secrets (Settings → Secrets → Actions).
      - name: Build Web (Next.js standalone)
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_ENV: ${{ secrets.NEXT_PUBLIC_APP_ENV }}
          NEXT_PUBLIC_ROOT_DOMAIN: ${{ secrets.NEXT_PUBLIC_ROOT_DOMAIN }}
          NEXT_PUBLIC_PROTOCOL: ${{ secrets.NEXT_PUBLIC_PROTOCOL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_NAME: ${{ secrets.NEXT_PUBLIC_APP_NAME }}
        run: pnpm --filter @bornoland/web build

      - name: Validate Web standalone artifact
        run: |
          if [ ! -f apps/web/.next/standalone/server.js ]; then
            echo "✗ apps/web/.next/standalone/server.js not found"
            echo "Contents of apps/web/.next/:"
            ls -la apps/web/.next/ || true
            exit 1
          fi
          echo "✓ Web standalone: apps/web/.next/standalone/server.js"

      # Next.js standalone needs static files + public dir alongside server.js
      - name: Assemble Web standalone (copy static + public)
        run: |
          cp -r apps/web/.next/static  apps/web/.next/standalone/.next/static
          cp -r apps/web/public        apps/web/.next/standalone/public
          echo "✓ static and public copied into standalone"

      # ── API production node_modules ───────────────────────────────────
      # pnpm deploy creates a clean dir with ONLY production deps (no tsup, tsc, etc.)
      # Both GitHub runner and EC2 are x86_64 Linux; native binaries are compatible.
      - name: Create API production deploy directory
        run: |
          pnpm --filter @bornoland/api deploy --prod /tmp/api-prod
          echo "✓ API prod node_modules: $(du -sh /tmp/api-prod/node_modules)"

      # ── Package release tarball ───────────────────────────────────────
      - name: Package release tarball
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          STAGE="$(mktemp -d)"
          TARBALL="bornoland-release-${SHA}.tar.gz"

          echo "Staging release to ${STAGE}..."

          # API: compiled output + production dependencies
          mkdir -p "${STAGE}/apps/api"
          cp -r apps/api/dist              "${STAGE}/apps/api/dist"
          cp    apps/api/package.json      "${STAGE}/apps/api/package.json"
          cp -r /tmp/api-prod/node_modules "${STAGE}/apps/api/node_modules"

          # Web: self-contained standalone server (includes its own node_modules)
          mkdir -p "${STAGE}/apps/web"
          cp -r apps/web/.next/standalone  "${STAGE}/apps/web/standalone"

          # Config: PM2 ecosystem + Nginx vhost
          cp ecosystem.config.cjs "${STAGE}/"
          mkdir -p "${STAGE}/nginx"
          cp nginx/bornosoft.site.conf "${STAGE}/nginx/"

          # Create tarball
          tar -czf "${TARBALL}" -C "${STAGE}" .

          echo ""
          echo "✓ Release tarball: ${TARBALL} ($(du -sh "${TARBALL}" | cut -f1))"
          echo ""
          echo "Contents (first 50 entries):"
          tar -tzf "${TARBALL}" | head -50

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bornoland-release-${{ steps.sha.outputs.sha }}
          path: bornoland-release-${{ steps.sha.outputs.sha }}.tar.gz
          retention-days: 7

  # ====================================================================
  # JOB 2 — DEPLOY TO EC2 (no compilation, no pnpm install)
  # ====================================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    env:
      RELEASE_SHA: ${{ needs.build.outputs.release_sha }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: bornoland-release-${{ needs.build.outputs.release_sha }}

      - name: Upload tarball to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: bornoland-release-${{ needs.build.outputs.release_sha }}.tar.gz
          target: /tmp/bornoland-artifacts/

      # ── Atomic deploy via SSH ─────────────────────────────────────────
      # EC2 only: extract → validate → env → nginx → symlink → pm2 reload → health
      # On any failure: automatic rollback to previous release
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: RELEASE_SHA
          # IMPORTANT: This script must NOT run any compilation.
          # It receives a pre-built tarball and deploys it atomically.
          script: |
            set -Eeuo pipefail

            ARTIFACT="/tmp/bornoland-artifacts/bornoland-release-${RELEASE_SHA}.tar.gz"
            RELEASES_BASE="$HOME/bornoLand-releases"
            NEW_RELEASE="${RELEASES_BASE}/release-${RELEASE_SHA}"
            CURRENT_LINK="${RELEASES_BASE}/current"
            # Secrets: managed manually on EC2, never committed to git
            # First-time setup: mkdir -p ~/bornoland-secrets
            #   cp ~/bornoLand-sass/apps/api/.env.production ~/bornoland-secrets/api.env
            #   cp ~/bornoLand-sass/apps/web/.env.production ~/bornoland-secrets/web.env
            SECRETS_DIR="$HOME/bornoland-secrets"
            LEGACY_DIR="$HOME/bornoLand-sass"

            # ── Track previous release for rollback ───────────────────
            PREVIOUS_RELEASE=""
            if [ -L "$CURRENT_LINK" ]; then
              PREVIOUS_RELEASE="$(readlink "$CURRENT_LINK")"
            fi

            rollback() {
              local code=$?
              echo ""
              echo "========================================="
              echo "  ROLLBACK TRIGGERED (exit ${code})"
              echo "========================================="

              if [ -n "$PREVIOUS_RELEASE" ] && [ -d "$PREVIOUS_RELEASE" ]; then
                echo "  Restoring: $PREVIOUS_RELEASE"
                ln -sfn "$PREVIOUS_RELEASE" "$CURRENT_LINK"
                pm2 reload bornoland-api --update-env 2>/dev/null \
                  || pm2 restart bornoland-api 2>/dev/null || true
                pm2 reload bornoland-web --update-env 2>/dev/null \
                  || pm2 restart bornoland-web 2>/dev/null || true
                pm2 save || true
                echo "  ✓ Rolled back to: $PREVIOUS_RELEASE"
              else
                echo "  ⚠ No previous release to roll back to"
              fi

              rm -rf "$NEW_RELEASE" || true

              echo ""
              echo "  Production remains on previous release."
              echo "========================================="
              exit "$code"
            }

            trap rollback ERR

            echo ""
            echo "========================================="
            echo "  BornoLand Deploy: ${RELEASE_SHA}"
            echo "  $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "========================================="

            # ── Lightweight system check ───────────────────────────────
            echo ""
            free -h || true
            df -h / || true

            # ── 1. Validate artifact ─────────────────────────────────
            echo ""
            echo "--- Step 1: Validate artifact ---"
            if [ ! -f "$ARTIFACT" ]; then
              echo "✗ Artifact not found: $ARTIFACT"
              exit 1
            fi
            echo "✓ Artifact: $(du -sh "$ARTIFACT" | cut -f1)"

            # ── 2. Extract to new release directory ──────────────────
            echo ""
            echo "--- Step 2: Extract ---"
            mkdir -p "$RELEASES_BASE"
            rm -rf "$NEW_RELEASE"
            mkdir -p "$NEW_RELEASE"
            tar -xzf "$ARTIFACT" -C "$NEW_RELEASE"
            echo "✓ Extracted to: $NEW_RELEASE"

            # ── 3. Validate critical files ────────────────────────────
            echo ""
            echo "--- Step 3: Validate files ---"

            for f in \
              "apps/api/dist/index.js" \
              "apps/web/standalone/server.js" \
              "ecosystem.config.cjs" \
              "nginx/bornosoft.site.conf"
            do
              if [ ! -f "$NEW_RELEASE/$f" ]; then
                echo "✗ Missing: $f"
                exit 1
              fi
              echo "✓ $f"
            done

            # ── 4. Install runtime environment files ──────────────────
            echo ""
            echo "--- Step 4: Environment files ---"

            install_env() {
              local name="$1"
              local primary="$2"
              local fallback="$3"
              local dest="$4"

              if [ -f "$primary" ]; then
                cp "$primary" "$NEW_RELEASE/$dest"
                echo "✓ $name → $dest"
              elif [ -f "$fallback" ]; then
                cp "$fallback" "$NEW_RELEASE/$dest"
                echo "✓ $name → $dest  (from legacy path — consider migrating to ~/bornoland-secrets/)"
              else
                echo "⚠ $name: no env file found at $primary or $fallback"
              fi
            }

            install_env "API" \
              "$SECRETS_DIR/api.env" \
              "$LEGACY_DIR/apps/api/.env.production" \
              "apps/api/.env.production"

            install_env "Web" \
              "$SECRETS_DIR/web.env" \
              "$LEGACY_DIR/apps/web/.env.production" \
              "apps/web/.env.production"

            # ── 5. Nginx ──────────────────────────────────────────────
            echo ""
            echo "--- Step 5: Nginx ---"

            for cert in \
              "/etc/letsencrypt/live/bornosoft.site/fullchain.pem" \
              "/etc/letsencrypt/live/bornosoft.site/privkey.pem"
            do
              if ! sudo test -f "$cert"; then
                echo "✗ SSL file missing: $cert"
                exit 1
              fi
            done
            echo "✓ SSL certificates present"

            NGINX_CONF="/etc/nginx/sites-available/bornosoft.site"
            NGINX_BACKUP="${NGINX_CONF}.bak"

            [ -f "$NGINX_CONF" ] && sudo cp "$NGINX_CONF" "$NGINX_BACKUP"

            sudo cp "$NEW_RELEASE/nginx/bornosoft.site.conf" "$NGINX_CONF"
            sudo ln -sf "$NGINX_CONF" /etc/nginx/sites-enabled/bornosoft.site
            [ -L /etc/nginx/sites-enabled/default ] && sudo rm -f /etc/nginx/sites-enabled/default

            if sudo nginx -t 2>&1; then
              echo "✓ Nginx config valid"
              sudo systemctl reload nginx
              sudo rm -f "$NGINX_BACKUP"
            else
              echo "✗ Nginx config invalid — restoring backup"
              [ -f "$NGINX_BACKUP" ] && sudo cp "$NGINX_BACKUP" "$NGINX_CONF" && sudo nginx -t || true
              exit 1
            fi

            # ── 6. Atomic symlink switch ──────────────────────────────
            echo ""
            echo "--- Step 6: Switch symlink ---"
            ln -sfn "$NEW_RELEASE" "$CURRENT_LINK"
            echo "✓ current → $NEW_RELEASE"

            # ── 7. PM2 graceful reload ────────────────────────────────
            echo ""
            echo "--- Step 7: PM2 reload ---"

            ECOSYSTEM="$NEW_RELEASE/ecosystem.config.cjs"

            if pm2 describe bornoland-api > /dev/null 2>&1 \
              && pm2 describe bornoland-web > /dev/null 2>&1; then
              # Graceful reload: new worker starts before old worker stops
              pm2 reload "$ECOSYSTEM" --update-env
            else
              echo "  ⚠ Processes not found — starting from ecosystem config"
              pm2 start "$ECOSYSTEM" --update-env
            fi

            pm2 save
            echo ""
            pm2 status

            # ── 8. Health checks (30s retry) ──────────────────────────
            echo ""
            echo "--- Step 8: Health checks ---"

            health_check() {
              local name="$1"
              local url="$2"
              local max=30
              local i=1

              printf "  %-40s " "${name}..."
              while [ $i -le $max ]; do
                if curl -fsS --max-time 5 "$url" > /dev/null 2>&1; then
                  echo "✓ OK (${i}s)"
                  return 0
                fi
                sleep 1
                i=$((i + 1))
              done
              echo "✗ FAILED after ${max}s"
              return 1
            }

            FAILED=0
            health_check "API  http://127.0.0.1:4000/"  "http://127.0.0.1:4000/" || FAILED=1
            health_check "Web  http://127.0.0.1:3000/"  "http://127.0.0.1:3000/" || FAILED=1

            if [ "$FAILED" -ne 0 ]; then
              echo ""
              echo "=== API logs ==="
              pm2 logs bornoland-api --lines 40 --nostream 2>/dev/null || true
              echo ""
              echo "=== Web logs ==="
              pm2 logs bornoland-web --lines 40 --nostream 2>/dev/null || true
              echo ""
              echo "=== Nginx errors ==="
              sudo tail -n 30 /var/log/nginx/error.log 2>/dev/null || true
              exit 1
            fi

            # ── 9. Cleanup old releases (keep current + 1 rollback) ───
            echo ""
            echo "--- Step 9: Cleanup ---"
            ls -dt "${RELEASES_BASE}"/release-* 2>/dev/null \
              | tail -n +3 \
              | xargs rm -rf 2>/dev/null || true
            rm -f "$ARTIFACT" 2>/dev/null || true
            echo "✓ Cleanup done"

            echo ""
            echo "========================================="
            echo "  DEPLOYMENT SUCCESS: ${RELEASE_SHA}"
            echo "  $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "========================================="
            echo "  Release: $NEW_RELEASE"
            echo "  API:     http://127.0.0.1:4000/"
            echo "  Web:     http://127.0.0.1:3000/"
            echo ""
