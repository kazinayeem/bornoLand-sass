name: BornoLand CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true

          script: |
            set -e

            echo "========================================"
            echo "       Starting BornoLand deployment"
            echo "========================================"

            # ----------------------------------------------------
            # 1. SSH to EC2 & navigate to repo
            # ----------------------------------------------------
            cd ~/bornoLand-sass

            # ----------------------------------------------------
            # 2. Fetch latest code
            # ----------------------------------------------------
            echo ""
            echo "=== 2. Fetch latest code ==="
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # ----------------------------------------------------
            # 3. Install dependencies
            # ----------------------------------------------------
            echo ""
            echo "=== 3. Install dependencies ==="
            pnpm install --no-frozen-lockfile

            # ----------------------------------------------------
            # 4. Remove production local env override
            # ----------------------------------------------------
            echo ""
            echo "=== 4. Remove production .env.local ==="
            rm -f apps/web/.env.local

            # ----------------------------------------------------
            # 5. Clean Next.js build
            # ----------------------------------------------------
            echo ""
            echo "=== 5. Clean Next.js build ==="
            rm -rf apps/web/.next

            # ----------------------------------------------------
            # 6. Build frontend + backend
            # ----------------------------------------------------
            echo ""
            echo "=== 6. Build frontend + backend ==="
            pnpm build

            # ----------------------------------------------------
            # 7. Install Nginx configuration
            # ----------------------------------------------------
            echo ""
            echo "=== 7. Install Nginx configuration ==="
            echo "--- Inspecting current Nginx sites-available / sites-enabled ---"
            ls -la /etc/nginx/sites-available/ || true
            ls -la /etc/nginx/sites-enabled/ || true

            # Check if SSL certificates exist
            SSL_CERT="/etc/letsencrypt/live/bornosoft.site/fullchain.pem"
            SSL_KEY="/etc/letsencrypt/live/bornosoft.site/privkey.pem"

            if [ -f "$SSL_CERT" ] && [ -f "$SSL_KEY" ]; then
              echo "  ✓ Found existing SSL certificates at $SSL_CERT"
              sudo cp nginx/bornosoft.site.conf /etc/nginx/sites-available/bornosoft.site
            else
              echo "  ! No SSL certificates found at $SSL_CERT yet — installing HTTP-only server blocks"
              # Create temporary HTTP-only config to prevent nginx -t failing on missing cert files
              sed '/server {/,/listen 443 ssl/!b; /listen 443 ssl/,/^[[:space:]]*}/d' nginx/bornosoft.site.conf > /tmp/bornosoft.site.http.conf
              sudo cp /tmp/bornosoft.site.http.conf /etc/nginx/sites-available/bornosoft.site
              rm -f /tmp/bornosoft.site.http.conf
            fi

            # Create / update symlink
            sudo ln -sf /etc/nginx/sites-available/bornosoft.site /etc/nginx/sites-enabled/bornosoft.site

            # Safely remove default installation symlink if present
            if [ -L /etc/nginx/sites-enabled/default ]; then
              echo "  Removing default Nginx installation symlink"
              sudo rm -f /etc/nginx/sites-enabled/default
            fi

            # ----------------------------------------------------
            # 8. Validate Nginx
            # ----------------------------------------------------
            echo ""
            echo "=== 8. Validate Nginx configuration ==="
            if ! sudo nginx -t; then
              echo "  ✗ Nginx configuration validation failed! Aborting deployment."
              exit 1
            fi
            echo "  ✓ Nginx configuration syntax is valid"

            # ----------------------------------------------------
            # 9. Reload Nginx
            # ----------------------------------------------------
            echo ""
            echo "=== 9. Reload Nginx ==="
            sudo systemctl reload nginx
            echo "  ✓ Nginx reloaded successfully"

            # ----------------------------------------------------
            # 10. Restart API
            # ----------------------------------------------------
            echo ""
            echo "=== 10. Restart API ==="
            pm2 restart bornoland-api --update-env

            # ----------------------------------------------------
            # 11. Restart Web
            # ----------------------------------------------------
            echo ""
            echo "=== 11. Restart Web ==="
            pm2 restart bornoland-web --update-env

            # ----------------------------------------------------
            # 12. Save PM2 configuration
            # ----------------------------------------------------
            echo ""
            echo "=== 12. Save PM2 configuration ==="
            pm2 save
            pm2 status

            # ----------------------------------------------------
            # 13. Health tests
            # ----------------------------------------------------
            echo ""
            echo "=== 13. Running health tests ==="

            run_health_check() {
              local name="$1"
              local url="$2"
              local host="$3"
              local max_retries=20
              local count=1

              echo "Checking $name ($url with Host: ${host:-none})..."

              while [ $count -le $max_retries ]; do
                if [ -n "$host" ]; then
                  if curl -fsS -H "Host: $host" "$url" -o /dev/null 2>/dev/null; then
                    echo "  ✓ $name is reachable and healthy (attempt $count)"
                    return 0
                  fi
                else
                  if curl -fsS "$url" -o /dev/null 2>/dev/null; then
                    echo "  ✓ $name is reachable and healthy (attempt $count)"
                    return 0
                  fi
                fi
                sleep 1
                count=$((count + 1))
              done

              echo "  ✗ $name failed health check after $max_retries attempts!"
              return 1
            }

            failed=0

            # 1. Test Next.js directly for root platform
            run_health_check "Next.js Direct (Platform Root)" "http://127.0.0.1:3000/" "bornosoft.site" || failed=1

            # 2. Test Next.js directly for tenant store
            run_health_check "Next.js Direct (Tenant Subdomain)" "http://127.0.0.1:3000/" "nayeem.bornosoft.site" || failed=1

            # 3. Test Nginx reverse proxy for root platform
            run_health_check "Nginx Ingress (Platform Root)" "http://127.0.0.1/" "bornosoft.site" || failed=1

            # 4. Test Nginx reverse proxy for tenant store
            run_health_check "Nginx Ingress (Tenant Subdomain)" "http://127.0.0.1/" "nayeem.bornosoft.site" || failed=1

            # 5. Test Express API directly
            run_health_check "Express API Direct" "http://127.0.0.1:4000/" "" || failed=1

            if [ $failed -ne 0 ]; then
              echo ""
              echo "========================================"
              echo "        HEALTH CHECK FAILURE DIAGNOSTICS"
              echo "========================================"
              echo ""
              echo "=== NGINX STATUS ==="
              sudo systemctl status nginx --no-pager || true
              echo ""
              echo "=== PM2 STATUS ==="
              pm2 status || true
              echo ""
              echo "=== RECENT NGINX ERROR LOG ==="
              sudo tail -n 50 /var/log/nginx/error.log || true
              echo ""
              echo "=== RECENT PM2 WEB LOGS ==="
              pm2 logs bornoland-web --lines 50 --nostream || true
              echo ""
              echo "=== RECENT PM2 API LOGS ==="
              pm2 logs bornoland-api --lines 50 --nostream || true
              echo ""
              echo "Deployment failed due to health check errors!"
              exit 1
            fi

            echo ""
            echo "========================================"
            echo "       DEPLOYMENT SUCCESS"
            echo "========================================"