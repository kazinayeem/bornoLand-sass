name: BornoLand CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |
            set -Eeuo pipefail

            BUILD_API_STATUS="PENDING"
            BUILD_WEB_STATUS="PENDING"
            NGINX_STATUS="PENDING"
            PM2_STATUS="RUNNING"
            HEALTH_STATUS="PENDING"

            print_summary() {
              echo ""
              echo "========================================"
              echo "          DEPLOYMENT SUMMARY"
              echo "========================================"
              echo "BUILD API:      $BUILD_API_STATUS"
              echo "BUILD WEB:      $BUILD_WEB_STATUS"
              echo "NGINX:          $NGINX_STATUS"
              echo "PM2:            $PM2_STATUS"
              echo "HEALTH CHECKS:  $HEALTH_STATUS"
              echo "========================================"
              echo ""
            }

            diagnostic() {
              echo ""
              echo "========================================"
              echo "          DEPLOYMENT DIAGNOSTICS"
              echo "========================================"

              echo ""
              echo "=== SYSTEM MEMORY ==="
              free -h || true

              echo ""
              echo "=== SWAP ==="
              swapon --show || true

              echo ""
              echo "=== DISK ==="
              df -h || true

              echo ""
              echo "=== NODE ==="
              node -v || true

              echo ""
              echo "=== PNPM ==="
              pnpm -v || true

              echo ""
              echo "=== PM2 ==="
              pm2 status || true

              echo ""
              echo "=== TOP MEMORY PROCESSES ==="
              ps aux --sort=-%mem 2>/dev/null \
                | awk '{print $1, $2, $3, $4, $5, $6, $11}' \
                | head -20 || true

              echo ""
              echo "=== CGROUP MEMORY ==="

              if [ -f "/sys/fs/cgroup/user.slice/user-$(id -u).slice/memory.max" ]; then
                echo "memory.max:"
                cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/memory.max" || true

                echo "memory.current:"
                cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/memory.current" || true
              fi

              echo ""
              echo "=== RECENT OOM EVENTS ==="

              sudo dmesg -T 2>/dev/null \
                | grep -i -E \
                  "oom|out of memory|killed process|task_memcg" \
                | tail -25 || true

              echo ""
              echo "========================================"
            }

            failure_handler() {
              local exit_code=$?

              echo ""
              echo "========================================"
              echo "       DEPLOYMENT FAILED"
              echo "       EXIT CODE: $exit_code"
              echo "========================================"

              diagnostic

              echo ""
              echo "IMPORTANT: Production processes were NOT intentionally stopped."

              print_summary

              exit "$exit_code"
            }

            trap failure_handler ERR

            echo "========================================"
            echo "       Starting BornoLand deployment"
            echo "========================================"

            # ====================================================
            # 1. Repository
            # ====================================================

            cd ~/bornoLand-sass

            echo ""
            echo "=== 1. Fetch latest code ==="

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # ====================================================
            # 2. Swap
            # ====================================================

            echo ""
            echo "=== 2. Verify swap ==="

            if [ "$(swapon --show --noheadings 2>/dev/null | wc -l)" -eq 0 ]; then

              echo "No active swap detected."

              if [ ! -f /swapfile ]; then
                sudo fallocate -l 2G /swapfile \
                  || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048

                sudo chmod 600 /swapfile
                sudo mkswap /swapfile
              fi

              sudo swapon /swapfile || true

              if ! grep -q '/swapfile' /etc/fstab 2>/dev/null; then
                echo '/swapfile none swap sw 0 0' \
                  | sudo tee -a /etc/fstab >/dev/null
              fi
            fi

            swapon --show

            # ====================================================
            # 3. Dependencies
            # ====================================================

            echo ""
            echo "=== 3. Install dependencies ==="

            pnpm install --frozen-lockfile

            # ====================================================
            # 4. Environment cleanup
            # ====================================================

            echo ""
            echo "=== 4. Clean production overrides ==="

            rm -f apps/web/.env.local

            # IMPORTANT:
            # Do NOT delete existing production artifacts before
            # the new build succeeds.
            #
            # This keeps the currently running application safe
            # if compilation fails.

            # ====================================================
            # 5. Diagnostics
            # ====================================================

            echo ""
            echo "=== 5. Build environment ==="

            echo "Architecture: $(uname -m)"
            echo "Node: $(node -v)"
            echo "PNPM: $(pnpm -v)"

            echo ""
            echo "=== Memory ==="
            free -h

            echo ""
            echo "=== esbuild preflight ==="

            cd apps/api

            ESBUILD_BIN="./node_modules/.bin/esbuild"

            if [ ! -x "$ESBUILD_BIN" ]; then
              echo "ERROR: esbuild binary not found:"
              echo "$ESBUILD_BIN"
              exit 1
            fi

            echo "esbuild path:"
            readlink -f "$ESBUILD_BIN"

            echo ""
            echo "esbuild version:"

            "$ESBUILD_BIN" --version

            echo ""
            echo "esbuild package version:"

            node -p "require('esbuild/package.json').version"

            echo ""
            echo "tsup version:"

            pnpm exec tsup --version

            cd ../..

            # ====================================================
            # 6. API build
            # ====================================================

            echo ""
            echo "========================================"
            echo "       BUILDING API"
            echo "========================================"

            cd apps/api

            # Use the previously known-working explicit command.
            # Do NOT depend on a potentially broken tsup config.

            if pnpm exec tsup \
              src/index.ts \
              --format esm \
              --out-dir dist \
              --clean \
              --no-splitting
            then
              BUILD_API_STATUS="SUCCESS"
              echo ""
              echo "✓ API build successful"
            else
              BUILD_API_STATUS="FAILED"

              echo ""
              echo "✗ API BUILD FAILED"
              echo ""
              echo "Production PM2 processes were never stopped."
              echo "Existing production artifacts remain untouched."

              exit 1
            fi

            # Verify API artifact

            if [ ! -f dist/index.js ]; then
              echo ""
              echo "✗ API build completed but dist/index.js was not generated."
              exit 1
            fi

            echo ""
            echo "API artifact:"
            ls -lah dist | head -30

            cd ../..

            # ====================================================
            # 7. Web build
            # ====================================================

            echo ""
            echo "========================================"
            echo "       BUILDING WEB"
            echo "========================================"

            cd apps/web

            if pnpm build; then
              BUILD_WEB_STATUS="SUCCESS"
              echo ""
              echo "✓ Web build successful"
            else
              BUILD_WEB_STATUS="FAILED"

              echo ""
              echo "✗ WEB BUILD FAILED"
              echo ""
              echo "Production PM2 processes were never stopped."

              exit 1
            fi

            cd ../..

            # ====================================================
            # 8. Validate build artifacts
            # ====================================================

            echo ""
            echo "=== 8. Validate production artifacts ==="

            if [ ! -f apps/api/dist/index.js ]; then
              echo "✗ Missing API production artifact."
              exit 1
            fi

            if [ ! -d apps/web/.next ]; then
              echo "✗ Missing Next.js production artifact."
              exit 1
            fi

            echo "✓ API artifact exists"
            echo "✓ Next.js artifact exists"

            # ====================================================
            # 9. Nginx configuration validation
            # ====================================================

            echo ""
            echo "========================================"
            echo "       VALIDATING NGINX"
            echo "========================================"

            SSL_CERT="/etc/letsencrypt/live/bornosoft.site/fullchain.pem"
            SSL_KEY="/etc/letsencrypt/live/bornosoft.site/privkey.pem"

            if ! sudo test -f "$SSL_CERT"; then
              echo "✗ SSL certificate missing:"
              echo "$SSL_CERT"
              exit 1
            fi

            if ! sudo test -f "$SSL_KEY"; then
              echo "✗ SSL private key missing:"
              echo "$SSL_KEY"
              exit 1
            fi

            NGINX_CONFIG="/etc/nginx/sites-available/bornosoft.site"
            NGINX_BACKUP="/etc/nginx/sites-available/bornosoft.site.bak"

            # Backup current working configuration

            if [ -f "$NGINX_CONFIG" ]; then
              sudo cp "$NGINX_CONFIG" "$NGINX_BACKUP"
            fi

            # Install repository configuration

            sudo cp \
              nginx/bornosoft.site.conf \
              "$NGINX_CONFIG"

            sudo ln -sf \
              "$NGINX_CONFIG" \
              /etc/nginx/sites-enabled/bornosoft.site

            if [ -L /etc/nginx/sites-enabled/default ]; then
              sudo rm -f /etc/nginx/sites-enabled/default
            fi

            # Validate BEFORE reload

            if sudo nginx -t; then

              echo "✓ Nginx configuration valid"

              sudo systemctl reload nginx

              NGINX_STATUS="SUCCESS"

              sudo rm -f "$NGINX_BACKUP"

            else

              echo "✗ Nginx validation failed"

              if [ -f "$NGINX_BACKUP" ]; then

                sudo cp \
                  "$NGINX_BACKUP" \
                  "$NGINX_CONFIG"

                sudo ln -sf \
                  "$NGINX_CONFIG" \
                  /etc/nginx/sites-enabled/bornosoft.site

                sudo nginx -t || true

                echo "✓ Previous Nginx configuration restored"
              fi

              NGINX_STATUS="FAILED"

              exit 1
            fi

            # ====================================================
            # 10. Restart application
            # ====================================================

            echo ""
            echo "========================================"
            echo "       STARTING APPLICATION"
            echo "========================================"

            # PM2 was never stopped during compilation.
            # Restart only after BOTH builds succeeded.

            pm2 restart bornoland-api --update-env
            pm2 restart bornoland-web --update-env

            pm2 save

            PM2_STATUS="SUCCESS"

            echo ""
            echo "✓ PM2 restarted"

            pm2 status

            # ====================================================
            # 11. Health checks
            # ====================================================

            echo ""
            echo "========================================"
            echo "       HEALTH CHECKS"
            echo "========================================"

            run_health_check() {

              local name="$1"
              local command="$2"

              local max_retries=30
              local count=1

              echo ""
              echo "Checking $name..."

              while [ "$count" -le "$max_retries" ]; do

                if eval "$command" >/dev/null 2>&1; then

                  echo "✓ $name healthy"
                  return 0

                fi

                sleep 1
                count=$((count + 1))

              done

              echo "✗ $name failed"

              return 1
            }

            failed=0

            run_health_check \
              "Next.js Direct" \
              "curl -fsS http://127.0.0.1:3000/" \
              || failed=1

            run_health_check \
              "Express API Direct" \
              "curl -fsS http://127.0.0.1:4000/" \
              || failed=1

            run_health_check \
              "HTTPS Root" \
              "curl -k -fsS --resolve bornosoft.site:443:127.0.0.1 https://bornosoft.site/" \
              || failed=1

            run_health_check \
              "HTTPS Tenant" \
              "curl -k -fsS --resolve nayeem.bornosoft.site:443:127.0.0.1 https://nayeem.bornosoft.site/" \
              || failed=1

            run_health_check \
              "HTTP HTTPS Redirect" \
              'test "$(curl -s -o /dev/null -w "%{http_code}" -H "Host: bornosoft.site" http://127.0.0.1/)" = "301"' \
              || failed=1

            if [ "$failed" -ne 0 ]; then

              HEALTH_STATUS="FAILED"

              echo ""
              echo "========================================"
              echo "       HEALTH CHECK FAILED"
              echo "========================================"

              sudo systemctl status nginx --no-pager || true

              echo ""
              echo "=== PM2 ==="
              pm2 status || true

              echo ""
              echo "=== API LOGS ==="
              pm2 logs bornoland-api --lines 50 --nostream || true

              echo ""
              echo "=== WEB LOGS ==="
              pm2 logs bornoland-web --lines 50 --nostream || true

              echo ""
              echo "=== NGINX ERROR LOG ==="
              sudo tail -n 50 /var/log/nginx/error.log || true

              exit 1
            fi

            HEALTH_STATUS="SUCCESS"

            # ====================================================
            # 12. Final status
            # ====================================================

            print_summary

            echo ""
            echo "========================================"
            echo "       DEPLOYMENT SUCCESS"
            echo "========================================"