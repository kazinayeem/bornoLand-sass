name: BornoLand CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true

          script: |
            set -e

            echo "========================================"
            echo "       Starting BornoLand deployment"
            echo "========================================"

            cd ~/bornoLand-sass

            echo ""
            echo "=== 1. Fetch latest code ==="
            git fetch origin main

            echo ""
            echo "=== 2. Switch to main ==="
            git checkout main

            echo ""
            echo "=== 3. Reset to latest origin/main ==="
            git reset --hard origin/main

            echo ""
            echo "=== 4. Install dependencies ==="
            pnpm install --no-frozen-lockfile

            echo ""
            echo "=== 5. Remove production .env.local ==="
            rm -f apps/web/.env.local

            echo ""
            echo "=== 6. Clean Next.js build ==="
            rm -rf apps/web/.next

            echo ""
            echo "=== 7. Build frontend + backend ==="
            pnpm build

            echo ""
            echo "=== 8. Restart API ==="
            pm2 restart bornoland-api --update-env

            echo ""
            echo "=== 9. Restart Web ==="
            pm2 restart bornoland-web --update-env

            echo ""
            echo "=== 10. Save PM2 configuration ==="
            pm2 save

            echo ""
            echo "=== 11. PM2 status ==="
            pm2 status

            echo ""
            echo "========================================"
            echo "       DEPLOYMENT SUCCESS"
            echo "========================================"