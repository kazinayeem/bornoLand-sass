# ==============================================================================
# BornoLand Production Nginx Configuration
#
# Domains:
#   - bornosoft.site        (Platform SaaS root / marketing)
#   - www.bornosoft.site    (Platform SaaS www alias)
#   - *.bornosoft.site      (Tenant store subdomains, e.g. nayeem.bornosoft.site)
#   - api.bornosoft.site    (Dedicated Express REST API backend)
#
# Upstream Targets:
#   - Next.js Web Frontend : 127.0.0.1:3000
#   - Express API Backend  : 127.0.0.1:4000
#
# SSL Certificate:
#   - Let's Encrypt Wildcard: /etc/letsencrypt/live/bornosoft.site/fullchain.pem
#   - Let's Encrypt Key     : /etc/letsencrypt/live/bornosoft.site/privkey.pem
# ==============================================================================

upstream bornoland_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream bornoland_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP (:80) — Redirect all HTTP requests to HTTPS (301 Permanent)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bornosoft.site www.bornosoft.site *.bornosoft.site api.bornosoft.site;

    # Allow Let's Encrypt ACME challenge if needed
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS preserving Host and URI
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS (:443) — Dedicated API Subdomain (api.bornosoft.site)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.bornosoft.site;

    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/bornosoft.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bornosoft.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://bornoland_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 3. HTTPS (:443) — Frontend: Platform Root, www, and Tenant Subdomains
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bornosoft.site www.bornosoft.site *.bornosoft.site;

    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/bornosoft.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bornosoft.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Direct /api/ traffic straight to Express API (avoids Next.js rewrite hop)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://bornoland_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # All frontend traffic -> Next.js (Root domain & tenant stores)
    location / {
        proxy_pass http://bornoland_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
